[env]
_.file = ".env"

[tools]
go = "1.27.2"
golangci-lint = "2.14.0"
typst = "0.15.1"
sqlite = "3.54.1"
zig = "0.17.0"
node = "24.22.0"
oxfmt = "0.74.0"

[tasks.install]
description = "Download the Go modules in go.sum"
run = "go mod download"

[tasks."install:bin"]
description = "Install both bots into $PREFIX/bin (default /usr/local)"
depends = ["build"]
run = '''
prefix="${PREFIX:-/usr/local}"
install -d "$prefix/bin"
install -m 0755 bin/botkit-latex bin/botkit-flow "$prefix/bin"
'''

[tasks."install:units"]
description = "Install the systemd units, which run /usr/local/bin, into $UNIT_DIR (default /etc/systemd/system)"
run = '''
dir="${UNIT_DIR:-/etc/systemd/system}"
install -d "$dir"
install -m 0644 contrib/systemd/botkit-latex.service contrib/systemd/botkit-flow.service "$dir"
'''

[tasks."dev:latex"]
description = "Start the latex bot locally"
run = "go run ./cmd/latex"

[tasks."dev:flow"]
description = "Start the flow bot locally"
run = "go run ./cmd/flow"

[tasks."env:example"]
description = "Rewrite .env.example from the settings the bots read"
run = "go run ./cmd/envfile"

[tasks."check:env-example"]
description = "Check .env.example against the settings the bots read"
run = '''
tmp="$(mktemp)"
trap 'rm -f "$tmp"' EXIT
go run ./cmd/envfile --stdout >"$tmp"
diff --unified=3 .env.example "$tmp"
'''

[tasks.test]
description = "Run all tests"
# The race detector needs cgo. zig is the C compiler, so a clean host needs no gcc.
env = { CGO_ENABLED = "1", CC = "zig cc" }
run = "go test -race ./..."

[tasks."build:latex"]
description = "Build the latex bot into bin/"
run = "go build -o bin/botkit-latex ./cmd/latex"

[tasks."build:flow"]
description = "Build the flow bot into bin/"
run = "go build -o bin/botkit-flow ./cmd/flow"

[tasks.build]
description = "Build both bots into bin/"
depends = ["build:latex", "build:flow"]

[tasks.lint]
description = "Check the Go code, Markdown, YAML and JSON without changing them"
depends = ["lint:*"]

[tasks."lint:go"]
description = "Verify the golangci-lint config, then check Go formatting and lint rules"
run = [
  "golangci-lint config verify",
  "golangci-lint fmt --diff",
  "golangci-lint run",
]

[tasks."lint:oxfmt"]
description = "Check the formatting of Markdown, YAML and JSON"
run = "oxfmt --check ."

[tasks.fix]
description = "Format the code and the documents, and apply safe lint fixes"
run = ["golangci-lint fmt", "golangci-lint run --fix", "oxfmt ."]

[tasks.check]
description = "Lint, test and build without changing tracked files"
depends = ["lint", "test", "build", "check:env-example"]
